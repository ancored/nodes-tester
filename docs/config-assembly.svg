<svg xmlns="http://www.w3.org/2000/svg" width="680" height="776" viewBox="0 0 680 776" role="img" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Как собирается итоговый конфиг sing-box на роутере</title>
<desc>Три цепочки — ноды из подписок, база и правила, пресеты — сходятся в apply-nodes.sh, который склеивает их через sing-box merge, проверяет, при изменениях перезапускает sing-box и проверяет связность; тестер работает с запущенным sing-box через API.</desc>
<style>
.t{font-size:14px;font-weight:500;text-anchor:middle}
.s{font-size:12px;text-anchor:middle}
.l{font-size:12px;fill:#5F5E5A}
.a{stroke:#888780;stroke-width:1.5;fill:none}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t{fill:#3C3489}.p .s{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t{fill:#085041}.g .s{fill:#0F6E56}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t{fill:#444441}.n .s{fill:#5F5E5A}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t{fill:#712B13}.c .s{fill:#993C1D}
rect{stroke-width:0.5}
@media (prefers-color-scheme: dark){
.l{fill:#B4B2A9}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t{fill:#CECBF6}.p .s{fill:#AFA9EC}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t{fill:#9FE1CB}.g .s{fill:#5DCAA5}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t{fill:#D3D1C7}.n .s{fill:#B4B2A9}
.c rect{fill:#712B13;stroke:#F0997B}.c .t{fill:#F5C4B3}.c .s{fill:#F0997B}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="p"><rect x="40" y="40" width="190" height="44" rx="4"/><text class="t" x="135" y="58">providers.json</text><text class="s" x="135" y="74">config-main/</text></g>
<g class="p"><rect x="245" y="40" width="190" height="44" rx="4"/><text class="t" x="340" y="58">singbox/</text><text class="s" x="340" y="74">base.json, rules.json</text></g>
<g class="p"><rect x="450" y="40" width="190" height="44" rx="4"/><text class="t" x="545" y="58">singbox/presets/</text><text class="s" x="545" y="74">пресеты *.json</text></g>

<line x1="135" y1="84" x2="135" y2="110" class="a" marker-end="url(#arrow)"/>
<line x1="340" y1="84" x2="340" y2="110" class="a" marker-end="url(#arrow)"/>
<line x1="545" y1="84" x2="545" y2="110" class="a" marker-end="url(#arrow)"/>

<g class="g"><rect x="40" y="112" width="190" height="44" rx="4"/><text class="t" x="135" y="130">nodes_fetch</text><text class="s" x="135" y="146">загрузка подписок</text></g>
<g class="g"><rect x="245" y="112" width="190" height="44" rx="4"/><text class="t" x="340" y="130">nodes_admin.rules</text><text class="s" x="340" y="146">загрузка правил</text></g>
<g class="g"><rect x="450" y="112" width="190" height="44" rx="4"/><text class="t" x="545" y="130">nodes_admin.presets</text><text class="s" x="545" y="146">удаляет блок _preset { }</text></g>

<line x1="135" y1="156" x2="135" y2="182" class="a" marker-end="url(#arrow)"/>
<line x1="340" y1="156" x2="340" y2="182" class="a" marker-end="url(#arrow)"/>
<line x1="545" y1="156" x2="545" y2="182" class="a" marker-end="url(#arrow)"/>

<g class="n"><rect x="40" y="184" width="190" height="44" rx="4"/><text class="t" x="135" y="202">raw/main.json</text><text class="s" x="135" y="218">сырые ноды</text></g>
<g class="n"><rect x="245" y="184" width="190" height="44" rx="4"/><text class="t" x="340" y="202">/etc/sing-box/</text><text class="s" x="340" y="218">base.json, rules/*.json</text></g>
<g class="n"><rect x="450" y="184" width="190" height="44" rx="4"/><text class="t" x="545" y="202">/tmp/tmp.XXXXXX/</text><text class="s" x="545" y="218">30-preset-***.json</text></g>

<line x1="135" y1="228" x2="135" y2="254" class="a" marker-end="url(#arrow)"/>
<g class="g"><rect x="40" y="256" width="190" height="60" rx="4"/><text class="t" x="135" y="274">nodes_config</text><text class="s" x="135" y="290">обработка сырых нод</text><text class="s" x="135" y="306">по groups_params.json</text></g>
<line x1="135" y1="316" x2="135" y2="342" class="a" marker-end="url(#arrow)"/>
<g class="n"><rect x="40" y="344" width="190" height="44" rx="4"/><text class="t" x="135" y="362">nodes.json</text><text class="s" x="135" y="378">ноды и группы</text></g>

<line x1="135" y1="388" x2="135" y2="424" class="a" marker-end="url(#arrow)"/>
<line x1="340" y1="228" x2="340" y2="424" class="a" marker-end="url(#arrow)"/>
<line x1="545" y1="228" x2="545" y2="424" class="a" marker-end="url(#arrow)"/>

<g class="g"><rect x="40" y="426" width="600" height="44" rx="4"/><text class="t" x="340" y="444">apply-nodes.sh: sing-box merge</text><text class="s" x="340" y="460">10-nodes + 20-base + 30-preset-*, порядок по имени файла</text></g>

<line x1="130" y1="470" x2="130" y2="496" class="a" marker-end="url(#arrow)"/>
<g class="g"><rect x="40" y="498" width="180" height="44" rx="4"/><text class="t" x="130" y="516">sing-box check</text><text class="s" x="130" y="532">ошибка — стоп</text></g>
<line x1="220" y1="520" x2="248" y2="520" class="a" marker-end="url(#arrow)"/>
<g class="g"><rect x="250" y="498" width="180" height="44" rx="4"/><text class="t" x="340" y="516">сравнение</text><text class="s" x="340" y="532">с config.json</text></g>
<line x1="430" y1="520" x2="458" y2="520" class="a" marker-end="url(#arrow)"/>
<g class="g"><rect x="460" y="498" width="180" height="44" rx="4"/><text class="t" x="550" y="516">замена, перезапуск</text><text class="s" x="550" y="532">только при изменении</text></g>

<line x1="550" y1="542" x2="550" y2="568" class="a" marker-end="url(#arrow)"/>
<g class="g"><rect x="460" y="570" width="180" height="44" rx="4"/><text class="t" x="550" y="588">URL-тест группы</text><text class="s" x="550" y="604">global-auto-out, API</text></g>
<line x1="460" y1="592" x2="432" y2="592" class="a" marker-end="url(#arrow)"/>
<g class="c"><rect x="250" y="570" width="180" height="44" rx="4"/><text class="t" x="340" y="588">откат на .prev</text><text class="s" x="340" y="604">если связи нет</text></g>

<path d="M550 614 L550 636 L170 636 L170 654" class="a" marker-end="url(#arrow)"/>
<g class="n"><rect x="40" y="656" width="260" height="44" rx="4"/><text class="t" x="170" y="674">sing-box</text><text class="s" x="170" y="690">итоговый config.json</text></g>
<line x1="302" y1="678" x2="378" y2="678" class="a" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="g"><rect x="380" y="656" width="260" height="44" rx="4"/><text class="t" x="510" y="674">nodes-tester</text><text class="s" x="510" y="690">API: группы, выбор, трафик</text></g>

<g class="p"><rect x="40" y="728" width="14" height="14" rx="3"/></g><text class="l" x="60" y="740">правите вы</text>
<g class="g"><rect x="160" y="728" width="14" height="14" rx="3"/></g><text class="l" x="180" y="740">модуль / шаг</text>
<g class="n"><rect x="290" y="728" width="14" height="14" rx="3"/></g><text class="l" x="310" y="740">создаётся автоматически</text>
<g class="c"><rect x="490" y="728" width="14" height="14" rx="3"/></g><text class="l" x="510" y="740">откат</text>
</svg>
